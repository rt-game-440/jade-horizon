id = "jade"
name = "Jade for Horizon"
version = "0.1.0"
description = "Shows information about what you are looking at. An unofficial Rust port of Snownee's Jade to Horizon."
authors = ["Snownee (original Jade)", "jade-horizon contributors"]
license = "CC-BY-NC-SA-4.0"
license_url = "https://creativecommons.org/licenses/by-nc-sa/4.0/"
credits = "Based on Jade by Snownee (https://github.com/Snownee/Jade), licensed CC BY-NC-SA 4.0. Translations from the Jade project and its translators."
# A wasm mod: Rust in src/, built to mod.wasm by `cargo horizon-mod build --wasm` against the SDK build Cargo.toml pins, beside data/ and assets/.
api = "0.2"
side = "both"
capabilities = ["registries"]

