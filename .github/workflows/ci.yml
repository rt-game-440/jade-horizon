# 检查、测试并构建 jade.hmod。用 Cargo.toml 固定的 SDK 版本。
# 推送 v* 标签时再把 jade.hmod 发布到 GitHub Release，说明取自 CHANGELOG.md。
name: CI

on:
  push:
    branches: [main]
    # 打 v<版本> 标签时构建并发布 GitHub Release。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 固定 cargo-horizon-mod 版本，与 Cargo.toml 固定的 SDK 配套使用。
  HORIZON_REPO: https://github.com/horizon-rust/horizon
  HORIZON_TOOL_REV: 89671a0eb8806ea5f53df929c4bb520248d813eb
  RUST_TOOLCHAIN: 1.99.1
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --component rust-src
          rustup default "$RUST_TOOLCHAIN"

      - name: 缓存 cargo-horizon-mod
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.HORIZON_TOOL_REV }}

      - name: 安装 cargo-horizon-mod
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: cargo install --git "$HORIZON_REPO" --rev "$HORIZON_TOOL_REV" cargo-horizon-mod --locked

      - name: 缓存 SDK 与构建产物
        uses: actions/cache@v4
        with:
          path: |
            .horizon
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: build-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-

      - name: 构建 wasm mod（check 需要它生成的 mod.wasm）
        run: cargo horizon-mod build --wasm

      - name: 检查 API 用法
        run: cargo horizon-mod check

      - name: 单元测试
        run: cargo test

      - name: 上传 jade.hmod
        uses: actions/upload-artifact@v4
        with:
          name: jade-hmod
          path: target/horizon-mod/jade.hmod
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载 jade.hmod
        uses: actions/download-artifact@v4
        with:
          name: jade-hmod

      - name: 核对版本并取出更新说明
        run: |
          version=$(grep -m1 "^version = " horizon-mod.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 horizon-mod.toml 的版本 $version 不一致"
            exit 1
          fi
          # CHANGELOG.md 里 "## <版本>" 到下一个 "## " 之间的内容。
          awk -v v="## $version" '$0 == v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md 里没有 ## $version 段落"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" jade.hmod --verify-tag \
            --title "Jade for Horizon $VERSION" --notes-file notes.md
